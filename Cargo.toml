[workspace]
members = ["crates/bt-core", "crates/bt-audio", "crates/bt-media", "crates/bt-app", "crates/bt-storage", "crates/bt-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0-alpha.6"
edition = "2024"
rust-version = "1.88"
authors = ["David Golden", "Rafael Rivera", "Dave Amenta", "xammen", "tokenbroker"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "raw_value"] }
thiserror = "2"
quick-xml = "0.41.0"
windows = "0.62"
