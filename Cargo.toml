[workspace]
members = ["crates/bt-core"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["David Golden", "Rafael Rivera", "Dave Amenta", "xammen"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
quick-xml = "0.41.0"
