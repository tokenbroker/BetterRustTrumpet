name: Release

# Pushing a tag like v0.1.0-alpha.2 builds the zip on GitHub and publishes it
# as a release (a pre-release when the tag has a "-" suffix). Running the
# workflow by hand only builds the zip and keeps it as a workflow artifact.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        shell: pwsh
        run: |
          # Static C runtime (as in .cargo/config.toml, which RUSTFLAGS
          # replaces) and no build-machine paths in the exes.
          $cargo = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { "$env:USERPROFILE\.cargo" }
          $env:RUSTFLAGS = "-C target-feature=+crt-static --remap-path-prefix=$cargo=/cargo --remap-path-prefix=$env:GITHUB_WORKSPACE=/build"
          cargo build --release --workspace

      - name: Package
        id: package
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { "dev-$($env:GITHUB_SHA.Substring(0, 7))" }
          # The app compares its own version with the releases' tags, so a
          # tag must match the workspace version.
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $version -ne $cargo) {
            throw "Tag $env:GITHUB_REF_NAME does not match the workspace version $cargo"
          }
          $name = "BetterRustTrumpet-$version"
          New-Item -ItemType Directory -Force stage | Out-Null
          Copy-Item target\release\BetterTrumpet.exe, target\release\bt.exe, LICENSE, THIRD_PARTY_NOTICES.md stage\
          $title = "Better Rust Trumpet $version"
          (Get-Content packaging\README.txt -Raw).Replace('{version}', $version).Replace('{underline}', '=' * $title.Length) | Set-Content stage\README.txt -Encoding utf8 -NoNewline
          Compress-Archive -Path stage\* -DestinationPath "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          "name=$name" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "hash=$hash" >> $env:GITHUB_OUTPUT

      - name: Sign the update
        shell: pwsh
        env:
          # D56: the private key exists only as this secret (and the maintainer's
          # own backups); it is written to the runner's temp folder for one
          # openssl call and deleted.
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if (-not $env:UPDATE_SIGNING_KEY) { throw "UPDATE_SIGNING_KEY is not set: releases must be signed" }
          $openssl = (Get-Command openssl -ErrorAction SilentlyContinue).Source
          if (-not $openssl) { $openssl = "C:\Program Files\Git\usr\bin\openssl.exe" }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\BetterTrumpet.exe, target\release\bt.exe dist\
          $files = foreach ($f in 'BetterTrumpet.exe', 'bt.exe') {
            [ordered]@{ name = $f; size = (Get-Item "dist\$f").Length; sha256 = (Get-FileHash "dist\$f" -Algorithm SHA256).Hash.ToLower() }
          }
          $manifest = [ordered]@{ app = 'BetterRustTrumpet'; version = '${{ steps.package.outputs.version }}'; files = @($files) } | ConvertTo-Json -Depth 4
          [IO.File]::WriteAllText("$PWD\dist\update.json", $manifest, [Text.UTF8Encoding]::new($false))
          $key = Join-Path $env:RUNNER_TEMP 'update-signing.pem'
          try {
            [IO.File]::WriteAllText($key, $env:UPDATE_SIGNING_KEY)
            & $openssl dgst -sha256 -sign $key -out dist\update.json.sig dist\update.json
            if ($LASTEXITCODE -ne 0) { throw "signing failed" }
          } finally {
            Remove-Item $key -Force -ErrorAction SilentlyContinue
          }
          # The app's compiled-in public key must accept it.
          & $openssl dgst -sha256 -verify packaging\update-signing.pub.pem -signature dist\update.json.sig dist\update.json
          if ($LASTEXITCODE -ne 0) { throw "the signature does not verify with packaging/update-signing.pub.pem" }
          Get-Content dist\update.json

      - name: Build the setup
        id: setup
        shell: pwsh
        run: |
          # D57: Inno Setup, as the original's installer.iss (installed if the
          # runner image lacks it).
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress | Out-Null
          }
          if (-not (Test-Path $iscc)) { throw "Inno Setup is not available" }
          $version = '${{ steps.package.outputs.version }}'
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $num = ($cargo -split '-')[0] + '.0'
          & $iscc /Q "/DVersion=$version" "/DNumVersion=$num" "/DSourceDir=$PWD\target\release" "/O$PWD\setup" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          $exe = Get-ChildItem setup\*.exe | Select-Object -First 1
          "file=$($exe.Name)" >> $env:GITHUB_OUTPUT
          "hash=$((Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower())" >> $env:GITHUB_OUTPUT

      - name: Keep the zip (manual runs)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            ${{ steps.package.outputs.name }}.zip
            dist/*
            setup/*

      - name: Publish the release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $zip = "${{ steps.package.outputs.name }}.zip"
          $notes = (Get-Content packaging\RELEASE_NOTES.md -Raw).Replace('{version}', '${{ steps.package.outputs.version }}').Replace('{sha256}', '${{ steps.package.outputs.hash }}').Replace('{zip}', $zip).Replace('{setup}', '${{ steps.setup.outputs.file }}').Replace('{setup_sha256}', '${{ steps.setup.outputs.hash }}')
          $notes | Set-Content notes.md -Encoding utf8
          $extra = @()
          if ($tag.Contains('-')) { $extra += '--prerelease' }
          # The setup and the zip for people; the exes and the signed
          # manifest for the app's updater (D56, D57).
          $assets = @((Get-ChildItem setup\*.exe).FullName, $zip) + (Get-ChildItem dist | ForEach-Object { $_.FullName })
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber
          } else {
            gh release create $tag @assets --title "Better Rust Trumpet ${{ steps.package.outputs.version }}" --notes-file notes.md @extra
          }
