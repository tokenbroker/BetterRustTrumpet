name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Format, clippy and tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # D56: a private key must never be committed (the release signing key
      # lives only in a secret and the maintainer's own backups).
      - name: No private keys
        shell: bash
        run: |
          if git grep -nE 'BEGIN ([A-Z]+ )?PRIVATE KEY-{5}' -- . || git ls-files | grep -E '(^|/)\.keys/|\.key\.pem$'; then
            echo "::error::a private key is tracked"; exit 1
          fi
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  msrv:
    name: Builds with the minimum Rust (1.88)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace
