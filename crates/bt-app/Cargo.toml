[package]
name = "bt-app"
description = "BetterTrumpet Rust port: tray app (preview)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license-file = "../../../LICENSE"

[[bin]]
name = "BetterTrumpet"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
bt-audio = { path = "../bt-audio" }
bt-media = { path = "../bt-media" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["tray-icon", "image-ico"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"

[target.'cfg(windows)'.dependencies]
bt-core = { path = "../bt-core" }
bt-storage = { path = "../bt-storage" }
windows = { workspace = true, features = ["Win32_Foundation", "Win32_System_Registry", "Win32_Security", "Wdk_System_Registry", "Wdk_System_SystemServices", "Win32_System_Environment", "Win32_System_Com", "Win32_Storage_Packaging_Appx", "Foundation", "Foundation_Collections", "Management_Core", "Storage", "Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_Time", "UI", "UI_ViewManagement"] }
# Same versions Tauri/wry use, for the WebView2 interfaces of hidden windows.
webview2-com = "0.38"
wv-core = { package = "windows-core", version = "0.61" }

[dev-dependencies]
tempfile = "3.27.0"
