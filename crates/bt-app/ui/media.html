<!doctype html>
<html lang="en" class="media-root">
<head>
  <meta charset="utf-8" />
  <title>BetterTrumpet media</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="media.css" />
</head>
<body class="media-body">
  <main id="media" aria-label="Now playing">
    <div class="art-wrap">
      <img id="art" alt="" hidden />
      <div id="art-placeholder"><svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="6" cy="18" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="18" cy="16" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></div>
    </div>
    <div class="info">
      <div id="title" class="title">Nothing playing</div>
      <div id="artist" class="artist"></div>
      <div class="timeline">
        <span id="position" class="time">0:00</span>
        <div id="progress" class="progress" role="slider" aria-label="Seek" tabindex="0"><div id="progress-fill" class="progress-fill"></div></div>
        <span id="duration" class="time">0:00</span>
      </div>
      <div class="controls">
        <button id="shuffle" class="ctl small" type="button" aria-label="Shuffle"><svg viewBox="0 0 24 24"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button>
        <button id="previous" class="ctl" type="button" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
        <button id="play" class="ctl main" type="button" aria-label="Play or pause"></button>
        <button id="next" class="ctl" type="button" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
        <button id="repeat" class="ctl small" type="button" aria-label="Repeat"><svg viewBox="0 0 24 24"><path d="M17 2l4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3" fill="none" stroke="currentColor" stroke-width="1.8"/></svg><span id="repeat-one" hidden>1</span></button>
      </div>
    </div>
  </main>
  <script src="media.js"></script>
</body>
</html>
