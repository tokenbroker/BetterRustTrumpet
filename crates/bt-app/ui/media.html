<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>BetterTrumpet media</title>
  <link rel="stylesheet" href="media.css" />
</head>
<body>
  <!-- Layout of the original's MediaPopupWindow.xaml. Icons are Phosphor
       (MIT), the same path data the original uses. -->
  <main id="media" aria-label="Now playing">
    <div id="content">
      <button id="expand" type="button" aria-label="Show cover art">
        <svg viewBox="0 0 256 256" class="caret"><path d="M216.49,104.49l-80,80a12,12,0,0,1-17,0l-80-80a12,12,0,0,1,17-17L128,159l71.51-71.52a12,12,0,0,1,17,17Z"/></svg>
      </button>
      <div id="cover" hidden>
        <div class="cover-shadow"></div>
        <div class="cover-frame">
          <img id="cover-img" alt="" />
          <div class="cover-shade"></div>
        </div>
      </div>
      <div id="marquee"><span id="title">No media playing</span></div>
      <div class="row timeline">
        <span id="position" class="time">0:00</span>
        <div id="progress" class="track" role="slider" aria-label="Seek" tabindex="0">
          <div class="rail"></div>
          <div id="progress-fill" class="fill"></div>
          <div id="progress-thumb" class="thumb"></div>
        </div>
        <span id="duration" class="time">0:00</span>
      </div>
      <div id="volume-row" class="row volume">
        <button id="mute" class="small" type="button" aria-label="Mute/Unmute" title="Mute/Unmute">
          <svg viewBox="0 0 256 256" class="vol-icon"><path id="vol-path" d=""/></svg>
        </button>
        <div id="volume" class="track" role="slider" aria-label="Volume" tabindex="0">
          <div class="rail"></div>
          <div id="volume-fill" class="fill"></div>
          <div id="volume-thumb" class="thumb glow"></div>
        </div>
        <span id="volume-text" class="vol-text">100</span>
      </div>
      <div class="controls">
        <div class="side left">
          <button id="shuffle" class="small toggle" type="button" aria-label="Shuffle" title="Shuffle" hidden>
            <svg viewBox="0 0 256 256"><path d="M240.49,175.51a12,12,0,0,1,0,17l-24,24a12,12,0,0,1-17-17L203,196h-2.09a76.17,76.17,0,0,1-61.85-31.83L97.38,105.78A52.1,52.1,0,0,0,55.06,84H32a12,12,0,0,1,0-24H55.06a76.17,76.17,0,0,1,61.85,31.83l41.71,58.39A52.1,52.1,0,0,0,200.94,172H203l-3.52-3.51a12,12,0,0,1,17-17Zm-95.62-72.62a12,12,0,0,0,16.93-1.13A52,52,0,0,1,200.94,84H203l-3.52,3.51a12,12,0,0,0,17,17l24-24a12,12,0,0,0,0-17l-24-24a12,12,0,0,0-17,17L203,60h-2.09a76,76,0,0,0-57.2,26A12,12,0,0,0,144.87,102.89Zm-33.74,50.22a12,12,0,0,0-16.93,1.13A52,52,0,0,1,55.06,172H32a12,12,0,0,0,0,24H55.06a76,76,0,0,0,57.2-26A12,12,0,0,0,111.13,153.11Z"/></svg>
          </button>
        </div>
        <div class="main-controls">
          <button id="previous" class="media" type="button" aria-label="Previous">
            <svg viewBox="0 0 256 256" class="skip"><path d="M201.75,30.52a20,20,0,0,0-20.3.53L68,102V40a12,12,0,0,0-24,0V216a12,12,0,0,0,24,0V154l113.45,71A20,20,0,0,0,212,208.12V47.88A19.86,19.86,0,0,0,201.75,30.52ZM188,200.73,71.7,128,188,55.27Z"/></svg>
          </button>
          <button id="play" class="media play" type="button" aria-label="Play or pause">
            <svg viewBox="0 0 256 256" class="play-icon"><path id="play-path" d=""/></svg>
          </button>
          <button id="next" class="media" type="button" aria-label="Next">
            <svg viewBox="0 0 256 256" class="skip"><path d="M200,28a12,12,0,0,0-12,12v62L74.55,31A20,20,0,0,0,44,47.88V208.12A20,20,0,0,0,74.55,225L188,154v62a12,12,0,0,0,24,0V40A12,12,0,0,0,200,28ZM68,200.73V55.27L184.3,128Z"/></svg>
          </button>
        </div>
        <div class="side right">
          <button id="repeat" class="small toggle" type="button" aria-label="Repeat" title="Repeat" hidden>
            <svg viewBox="0 0 256 256"><path id="repeat-path" d=""/></svg>
          </button>
        </div>
      </div>
    </div>
  </main>
  <script src="media.js"></script>
</body>
</html>
